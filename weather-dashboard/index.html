<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Weather Dashboard</p>
          <h1>Check the forecast instantly</h1>
          <p>Search a city name and get current conditions plus a 5-day forecast.</p>
        </div>
      </header>

      <section class="search-panel">
        <label class="search-label" for="city-input">Enter city</label>
        <div class="search-row">
          <input id="city-input" type="text" placeholder="e.g. London" autocomplete="off" />
          <button id="search-button" class="primary">Search</button>
        </div>
        <div id="error-message" class="message hidden"></div>
      </section>

      <section id="weather-card" class="weather-card hidden" aria-live="polite">
        <div class="weather-header">
          <div>
            <h2 id="city-name"></h2>
            <p id="weather-description"></p>
          </div>
          <div class="weather-temp">
            <span id="temperature"></span>
            <small>°C</small>
          </div>
        </div>

        <div class="weather-details-grid">
          <div class="weather-detail">
            <span>Feels like</span>
            <strong id="feels-like"></strong>
          </div>
          <div class="weather-detail">
            <span>Humidity</span>
            <strong id="humidity"></strong>
          </div>
          <div class="weather-detail">
            <span>Wind</span>
            <strong id="wind-speed"></strong>
          </div>
          <div class="weather-detail">
            <span>Condition</span>
            <strong id="condition-main"></strong>
          </div>
        </div>
      </section>

      <section id="forecast-section" class="forecast-section hidden">
        <h3>5-Day Forecast</h3>
        <div id="forecast-grid" class="forecast-grid"></div>
      </section>

      <section class="tips-card">
        <h3>Setup</h3>
        <p>Open <code>app.js</code> and replace <code>YOUR_OPENWEATHERMAP_API_KEY</code> with your API key.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
