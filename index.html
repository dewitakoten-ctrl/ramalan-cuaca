<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="header">
        <h1>To-Do List</h1>
        <p>Manage tasks with add, edit, complete, and remove actions.</p>
      </section>

      <section class="task-form">
        <label for="new-task">New task</label>
        <div class="task-form-row">
          <input id="new-task" type="text" placeholder="Enter a task" />
          <button id="add-task-btn" class="primary">Add</button>
        </div>
      </section>

      <section class="task-list-section">
        <div class="task-list-header">
          <h2>Your tasks</h2>
          <p id="task-count">0 tasks</p>
        </div>
        <ul id="task-list" class="task-list" aria-live="polite"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
